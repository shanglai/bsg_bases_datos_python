# =====================================================================
# c3_s1_b2_docker_compose.yml
# Sesion 3.1: entorno de MongoDB para el curso
#
# Levantar:    docker compose -f c3_s1_b2_docker_compose.yml up -d
# Estado:      docker compose -f c3_s1_b2_docker_compose.yml ps
# Bitacora:    docker compose -f c3_s1_b2_docker_compose.yml logs -f
# Consola:     docker exec -it curso_mongo mongosh -u curso -p
# Detener:     docker compose -f c3_s1_b2_docker_compose.yml stop
# Borrar todo: docker compose -f c3_s1_b2_docker_compose.yml down -v
#
# Las credenciales se leen del mismo archivo .env que usa PostgreSQL.
# Ver c3_s1_b2_env_ejemplo.txt
#
# Este archivo NO sustituye al de PostgreSQL. Ambos motores conviven:
# el capitulo 3 lee de PostgreSQL para cargar en MongoDB, y la sesion
# 3.3 los compara ejecutando la misma consulta en los dos.
# =====================================================================

services:
  mongo:
    image: mongo:7
    container_name: curso_mongo

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}

    ports:
      # Si el equipo ya tiene un MongoDB en el 27017, cambiar el primer
      # numero a 27018 y ajustar MONGO_PORT en el archivo .env.
      - "${MONGO_PORT:-27017}:27017"

    volumes:
      # Conserva los datos aunque el contenedor se elimine.
      - mongodata:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

volumes:
  mongodata:
